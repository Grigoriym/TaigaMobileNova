# Header-auth reverse proxy in front of the local Taiga (localhost:9000), for verifying custom
# request headers. Listens on 9100; rejects any request without `X-Proxy-Token: secret` with a
# 401 that carries no `WWW-Authenticate: Bearer` challenge (i.e. a proxy rejection, not Taiga's).
# Taiga builds media URLs from its own configured domain (http://localhost:9000); the sub_filter
# rewrites them onto whatever host the client used to reach the proxy, so avatars are fetched
# through the proxy too, as they would be in a real deployment.
server {
    listen 9100;
    client_max_body_size 100m;

    location / {
        if ($http_x_proxy_token != "secret") {
            return 401;
        }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://localhost:9000' 'http://$http_host';
    }
}
