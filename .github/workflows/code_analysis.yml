name: Code Analysis
permissions:
  contents: read
  pull-requests: write

on:
    pull_request:
        branches:
            - dev
            - master
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'art/**'
            - 'playstore/**'
            - 'fastlane/metadata/**'
            - 'LICENSE'
    push:
        branches:
            - dev
            - master
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'art/**'
            - 'playstore/**'
            - 'fastlane/metadata/**'
            - 'LICENSE'

concurrency:
    group: code-analysis-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
  code_analysis:
    runs-on: ubuntu-latest
    env:
        TAIGA_PATH_R: ${{ secrets.TAIGA_PATH_R }}
        TAIGA_KEY_PASS_R: ${{ secrets.TAIGA_KEY_PASS_R }}
        TAIGA_STORE_PASS_R: ${{ secrets.TAIGA_STORE_PASS_R }}
        TAIGA_ALIAS_R: ${{ secrets.TAIGA_ALIAS_R }}
        ENCODED_STRING_R: ${{ secrets.TAIGA_KEYSTORE_R }}
        TAIGA_PATH_D: ${{ secrets.TAIGA_PATH_D }}
        TAIGA_KEY_PASS_D: ${{ secrets.TAIGA_KEY_PASS_D }}
        TAIGA_STORE_PASS_D: ${{ secrets.TAIGA_STORE_PASS_D }}
        TAIGA_ALIAS_D: ${{ secrets.TAIGA_ALIAS_D }}
        ENCODED_STRING_D: ${{ secrets.TAIGA_KEYSTORE_D }}
        ENCODED_GOOGLE_SERVICES_GPLAY: ${{ secrets.GOOGLE_SERVICES_GPLAY }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup Android Environment
        uses: ./.github/actions/android-setup-composite-action

      - name: Restore google-services.json
        run: echo $ENCODED_GOOGLE_SERVICES_GPLAY | base64 -d > ./androidApp/src/gplay/google-services.json

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Ktlint
        run: ./gradlew ktlintCheck

      - name: Run Android/Compose lint
        run: ./gradlew :androidApp:lintFdroidDebug :androidApp:lintGplayDebug -PgplayBuild

      # koverXmlReport only runs jvmTest for the modules aggregated in the root
      # build.gradle.kts kover {} block, so a test in a non-aggregated module
      # (:testing, :uikit, :tools:*) would never execute. This step runs every
      # jvmTest task; the Kover step below then reuses the results.
      - name: Run tests
        run: ./gradlew jvmTest

      - name: Generate Kover XML report
        run: ./gradlew koverXmlReport

      - name: Debug coverage report
        run: |
            echo "Coverage report exists:"
            ls -la ./build/reports/kover/ || echo "Directory not found"
            echo "Current branch: ${{ github.head_ref || github.ref_name }}"
            echo "Current commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Base branch: ${{ github.base_ref || 'N/A' }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./build/reports/kover/report.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}

      # Runs after the Codecov upload on purpose: when the floor is breached, the report
      # is already published, so the drop can be diagnosed from the PR rather than by
      # re-running the build locally. Qualified as :koverVerify because the unqualified
      # name would also run the rule-less koverVerify of every module.
      - name: Check coverage floor
        run: ./gradlew :koverVerify
