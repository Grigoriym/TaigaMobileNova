name: Release

on:
    push:
        tags:
            - v*

jobs:
    release:
        permissions: write-all
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
            TAIGA_PATH_R: ${{ secrets.TAIGA_PATH_R }}
            TAIGA_KEY_PASS_R: ${{ secrets.TAIGA_KEY_PASS_R }}
            TAIGA_STORE_PASS_R: ${{ secrets.TAIGA_STORE_PASS_R }}
            TAIGA_ALIAS_R: ${{ secrets.TAIGA_ALIAS_R }}
            ENCODED_STRING_R: ${{ secrets.TAIGA_KEYSTORE_R }}

            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Check out the repo
              uses: actions/checkout@v6

            - name: Setup Android Environment
              uses: ./.github/actions/android-setup-composite-action

            - name: Restore taigamobilenova_keystore_release.jks
              run: echo $ENCODED_STRING_R | base64 -d > ./taigamobilenova_keystore_release.jks

            - name: Build Release Fdroid APK
              run: |
                  ./gradlew :composeApp:assembleFdroidRelease :composeApp:assembleFdroidDebug

            - name: Build Release Gplay APK and AAB
              run: |
                  ./gradlew :composeApp:assembleGplayRelease :composeApp:bundleGplayRelease

            - name: Upload Release Build To Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-artifacts
                  path: |
                      composeApp/build/outputs/apk/*
                      composeApp/build/outputs/bundle/*

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  draft: false
                  make_latest: true
                  preserve_order: true
                  files: |
                      composeApp/build/outputs/apk/fdroid/release/composeApp-fdroid-release.apk
                      composeApp/build/outputs/apk/fdroid/debug/composeApp-fdroid-debug.apk
                      composeApp/build/outputs/apk/gplay/release/composeApp-gplay-release.apk
                      composeApp/build/outputs/bundle/gplayRelease/composeApp-gplay-release.aab