name: Guardrails

# Deliberately no `paths-ignore`, unlike build.yml/code_analysis.yml: a commit that only edits
# CLAUDE.md produces no CI run at all, and that file decides what every later session is allowed
# to do.

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the range to check
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base="$BASE_REF"
            head="$HEAD_REF"
            if [ "$base" = 'master' ] && [[ "$head" == release/* ]]; then
              # A release/* branch is dev plus release-only commits (version bump,
              # changelog stubs, last-minute fixes) merged on top of it. Every commit
              # reachable from dev was already gated by its own PR into dev, so diffing
              # against master here would re-check that whole backlog on every release
              # PR, including commits that predate this workflow.
              base='dev'
            fi
            range="origin/${base}..HEAD"
          else
            before='${{ github.event.before }}'
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse --verify --quiet 'HEAD^' || echo '')"
            fi
            range="${before:+${before}..}HEAD"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "Checking ${range}"

      - name: Check the gate tripwires
        run: .github/scripts/check-guardrails.sh '${{ steps.range.outputs.range }}'

      - name: Validate workflow YAML syntax
        run: |
          npm install --no-save js-yaml
          for f in .github/workflows/*.yml; do
            echo "Checking ${f}"
            node -e "require('js-yaml').load(require('fs').readFileSync('${f}', 'utf8'))"
          done
